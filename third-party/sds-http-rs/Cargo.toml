[package]
name = "sds-http-rs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "sds_http_rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
base64 = "0.22"
httparse = "1.10"
percent-encoding = "2.3"
rustls = { version = "0.23.25", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pemfile = "2.2"
rustls-pki-types = "1.11"
rustls-webpki = { version = "0.103", default-features = false, features = ["aws-lc-rs", "std"] }
socket2 = "0.6"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false }

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
